# docker-compose.yaml — produção (Coolify)
# IMPORTANTE: SEM `ports:` — Coolify faz roteamento via Caddy.
# Cada serviço expõe sua porta INTERNA (7301/7302/7303) e Coolify direciona o domínio.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_PORT: 7301
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_LOGIN_WINDOW_SEC: ${RATE_LIMIT_LOGIN_WINDOW_SEC:-60}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-neura-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # URLs públicas — obrigatórias pra Telegram webhook (Onda 4) + links em emails.
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      APP_URL: ${APP_URL}
      # OpenAI (opcional) — habilita 6 features IA: Whisper, sugestões, classify,
      # summarize, next-actions, forecast, KB embeddings, KB auto-suggest. Sem
      # key, features degradam silenciosamente.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
      WHISPER_API_BASE: ${WHISPER_API_BASE:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      - postgres
      - redis
      - minio
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7301/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: 7302
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    depends_on:
      - api
    healthcheck:
      # Next responde 200 em / (página landing redireciona pra /login). Wget em alpine vem builtin.
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:7302/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  waworker:
    build:
      context: .
      dockerfile: Dockerfile
      target: waworker-runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WAWORKER_PORT: 7303
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-neura-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 oficial + extensão pgvector pré-instalada.
    # Compat 100% com volume gerado por postgres:16-alpine (mesmo data layout).
    # Usado pra Knowledge Base + RAG (busca semântica via embeddings OpenAI).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neura_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neura} -d ${POSTGRES_DB:-neura_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:

# Rede coolify external: o Caddy do Coolify vive nela; rede própria (bridge isolada)
# causa "HTTPS handshake OK + upstream timeout" intermitente após restarts.
networks:
  default:
    name: coolify
    external: true
