packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@whiskeysockets/baileys": true
  msgpackr-extract: true
  protobufjs: true

# Baileys traz libsignal via git repo (subdep) — pnpm 11 bloqueia por default
blockExoticSubdeps: false

# Runtime (Docker): as imagens api/waworker têm o workspace PODADO (só os apps que
# precisam). O default do pnpm 11 (verifyDepsBeforeRun=install) detecta o workspace
# incompleto como "deps desatualizadas" e dispara `pnpm install` ANTES de rodar
# qualquer script (migrate:deploy) — que falha em runtime → CMD sai 1 → crash-loop.
# `false` desliga esse check (não há o que instalar em runtime; deps já vêm do builder).
verifyDepsBeforeRun: false
