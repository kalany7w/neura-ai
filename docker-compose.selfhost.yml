# docker-compose.selfhost.yml — generic self-hosted deployment (no Coolify).
#
#   cp .env.example .env   # fill in the required values
#   docker compose -f docker-compose.selfhost.yml up -d --build
#
# Exposes the web UI on ${WEB_PORT:-7302} and the API on ${API_PORT:-7301}.
# For a public deployment, put a reverse proxy (Caddy/nginx/Traefik) in front
# of both ports and set the *_URL variables to your public domains — see
# docs/SELF_HOSTING.md.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    restart: unless-stopped
    ports:
      - '${API_PORT:-7301}:7301'
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-neura}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-neura_ai}
      REDIS_URL: redis://redis:6379
      API_PORT: 7301
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate with openssl rand -hex 32}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:7301}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:7302}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with openssl rand -hex 32}
      # Email — one provider required: SMTP (generic) or Resend.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM (transactional sender address)}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Neura AI}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-5}
      RATE_LIMIT_LOGIN_WINDOW_SEC: ${RATE_LIMIT_LOGIN_WINDOW_SEC:-60}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-neura-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-neura-media}
      MINIO_USE_SSL: 'false'
      # Public URLs — required for Telegram webhooks + links inside emails.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:7301}
      APP_URL: ${APP_URL:-http://localhost:7302}
      # OpenAI (optional) — enables Whisper transcription + AI features.
      # Leave empty to disable gracefully.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-1}
      WHISPER_API_BASE: ${WHISPER_API_BASE:-https://api.openai.com/v1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:7301/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
      args:
        # Baked into the client bundle at build time — rebuild after changing.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7301}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:7301/ws}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-7302}:7302'
    environment:
      NODE_ENV: production
      WEB_PORT: 7302
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:7301}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:7301/ws}
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:7302/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  waworker:
    build:
      context: .
      dockerfile: Dockerfile
      target: waworker-runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-neura}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neura_ai}
      REDIS_URL: redis://redis:6379
      WAWORKER_PORT: 7303
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-neura-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-neura-media}
      MINIO_USE_SSL: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    # Postgres 16 + pgvector (Knowledge Base / RAG embeddings).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neura_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-neura} -d ${POSTGRES_DB:-neura_ai}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-neura-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
