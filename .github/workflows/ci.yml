name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neura_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neura_ai_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      BETTER_AUTH_SECRET: ${{ secrets.CI_BETTER_AUTH_SECRET || '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' }}
      BETTER_AUTH_URL: http://localhost:7301
      TRUSTED_ORIGINS: http://localhost:7302
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      RESEND_API_KEY: re_test_fake_key_for_ci_only
      RESEND_FROM: noreply@neura-ai.net
      RESEND_FROM_NAME: Neura AI CI
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E smoke (@smoke): páginas públicas + gate de auth do middleware. Só precisa
  # do web buildado + rodando — sem api/db (por isso é um job à parte, leve).
  # Os testes @fullstack (signup→app) exigem o stack completo e ficam pra um job
  # dedicado/staging (ver apps/web/e2e/README.md).
  e2e-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:7301
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build web (+ deps)
        run: pnpm --filter @neura/web... build

      - name: Install Playwright browser
        run: pnpm --filter @neura/web exec playwright install --with-deps chromium

      - name: Run @smoke E2E
        run: |
          pnpm --filter @neura/web start &
          for i in $(seq 1 60); do curl -sf http://localhost:7302/login >/dev/null && break; sleep 2; done
          E2E_BASE_URL=http://localhost:7302 pnpm --filter @neura/web test:e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
