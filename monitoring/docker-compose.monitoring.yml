# Stack de monitoramento (Prometheus + Grafana) pro Neura AI.
# Sobe à parte do app. Pra o Prometheus alcançar a API por 'api:7301', conecte
# na rede do compose principal (ver README) ou ajuste o target em
# prometheus/prometheus.yml pro host/IP correto.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Interpolado nos contact points de alerta (provisioning/alerting). Mesmo
      # webhook Discord/Slack do ALERT_WEBHOOK_URL do app.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
