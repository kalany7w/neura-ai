apiVersion: 1

providers:
  - name: neura
    orgId: 1
    folder: Neura
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      # Onde os JSONs dos dashboards são montados (ver docker-compose.monitoring.yml).
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
