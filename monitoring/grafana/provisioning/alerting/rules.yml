apiVersion: 1

groups:
  - orgId: 1
    name: neura-api-slo
    folder: Neura
    interval: 1m
    rules:
      - uid: neura-http-5xx
        title: API — erros 5xx acima de 5%
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: Taxa de 5xx da API acima de 5% nos últimos 5min.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: 100 * sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }

      - uid: neura-http-p95
        title: API — latência p95 acima de 2s
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: Latência p95 da API acima de 2s nos últimos 5min.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [2] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }

      - uid: neura-api-down
        title: API — target fora (Prometheus não alcança /metrics)
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: O scrape da API está down (API caída ou inacessível). O waworker
            é coberto pelo monitor de uptime externo em /health/worker.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              editorMode: code
              expr: up{job="neura-api"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
